plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '5.1.+'
}

version = '1.0.0'
group = 'mcauto'
archivesBaseName = 'mcauto-world118'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    // 1.16.5 用官方映射（mojmap），运行时成员是 SRG，ForgeGradle 会自动 reobf
    mappings channel: 'official', version: '1.16.5'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                mcauto {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            mods {
                mcauto {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.39'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "mcauto",
                "Specification-Vendor"    : "mcauto",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "mcauto",
        ])
    }
}

jar.finalizedBy('reobfJar')


tasks.register('printCp') {
    doLast {
        configurations.compileClasspath.each { println "CP: " + it }
    }
}
